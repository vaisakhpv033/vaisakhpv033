name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual triggering

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-contribution-grid-snake.svg  # ✅ Save output inside "dist" folder

      - name: Push snake animation to GitHub
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output  # ✅ Ensure branch exists
          build_dir: dist        # ✅ Push only the "dist" folder
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}  # ✅ Ensure GH_PAT is set
